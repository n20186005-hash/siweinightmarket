<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>離線｜四維夜市</title>
    <style>
      :root { color-scheme: light; }
      body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: #fffaf0; color: #07111f; font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; text-align: center; padding: 1.5rem; }
      .card { max-width: 28rem; }
      .badge { display: inline-grid; place-items: center; width: 3.5rem; height: 3.5rem; border-radius: 9999px; background: #f8b84e; color: #07111f; font-weight: 900; font-size: 1.5rem; }
      h1 { font-size: 1.6rem; margin: 1rem 0 .5rem; }
      p { color: #475569; line-height: 1.7; }
      a { display: inline-block; margin-top: 1.25rem; border-radius: 9999px; background: #07111f; color: #fff; font-weight: 800; padding: .75rem 1.5rem; text-decoration: none; }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">四</span>
      <h1>目前沒有網路連線</h1>
      <p>四維夜市指南需要連線才能顯示最新位置、營業日與交通資訊。請確認網路後再試，或返回首頁查看已快取的內容。</p>
      <a href="/">回到四維夜市首頁</a>
    </div>
  </body>
</html>
